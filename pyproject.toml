[project]
name = "my-dify"
version = "0.1.0"
description = "A small Dify-inspired learning project."
readme = "README.md"
authors = [
    { name = "wuxiao", email = "wuxiao@mgbig.cn" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "flask>=3.1,<4",
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "flask-sqlalchemy>=3.1,<4",
    "gunicorn>=23,<24",
    "email-validator>=2,<3",
    "flask-migrate>=4,<5",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/my_dify"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]
addopts = "-q"
