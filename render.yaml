services:
  - type: web
    name: my-dify
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MY_DIFY_MODEL_BASE_URL
        value: https://api.deepseek.com
      - key: MY_DIFY_MODEL_API_KEY
        sync: false
      - key: MY_DIFY_MODEL_NAME
        value: deepseek-chat
      - key: MY_DIFY_MODEL_TIMEOUT
        value: "60"
      - key: MY_DIFY_DATABASE_URL
        fromDatabase:
          name: my-dify-db
          property: connectionString
      - key: MY_DIFY_SECRET_KEY
        generateValue: true
      - key: MY_DIFY_SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: my-dify-db
    plan: free
    databaseName: my_dify
    user: my_dify
